<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>예약 관리</title>
<link rel="manifest" href="manifest-admin.json"><meta name="theme-color" content="#0b7285">
<link rel="apple-touch-icon" href="admin-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="예약관리">
<style>
:root{--bg:#f4f8fb;--card:#fff;--tx:#1d2b36;--mut:#66788a;--pr:#1c7ed6;--ln:#d9e3ec;--red:#e03131}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mut:#9aabb8;--pr:#4dabf7;--ln:#2a3945;--red:#ff8787}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 12px}.lg{width:28px;height:28px;vertical-align:-6px;margin-right:8px}h2{font-size:17px;margin:0}h3{font-size:15px;margin:16px 0 4px;color:var(--pr)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
input{padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
#login input{display:block;width:100%;margin-bottom:8px}
button{padding:9px 14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--red);border:1px solid var(--ln);padding:5px 10px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.row b{min-width:48px}.row span{flex:1}.mut{color:var(--mut);font-size:14px}
</style></head><body><main>
<h1><svg class="lg" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#e03131"/><path d="M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z" fill="#fff"/></svg>상당이비인후과 예약 관리</h1>
<section class="card" id="login">
<input id="em" type="email" placeholder="관리자 이메일" autocomplete="username">
<input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
<button id="lg">로그인</button></section>
<div id="panel" hidden>
<section class="card"><div class="top"><h2>예정된 예약</h2><span><button id="rf">새로고침</button> <button id="out" class="s">로그아웃</button></span></div><div id="list"></div></section>
<section class="card"><h2>휴진일 지정</h2><p class="mut">지정한 날짜는 예약 화면 달력에서 사라져요.</p>
<div class="top"><input type="date" id="cd"><input id="cm" placeholder="메모 (예: 휴가)"><button id="ca">추가</button></div><div id="cl"></div></section>
</div>
<section class="card mut" id="inst"><b>📲 관리자 앱으로 설치</b><br>브라우저 메뉴의 "홈 화면에 추가"를 누르면 바탕화면에 아이콘이 생겨요. (아이폰: Safari 공유 버튼 → 홈 화면에 추가)
<button id="ib" hidden>홈 화면에 추가</button></section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// index.html과 같은 Firebase 설정값
const FB={apiKey:"AIzaSyBqyn-B4YYD1pggjGDuu-Z2cr3wWw9KjFg",authDomain:"sangdang-ent.firebaseapp.com",projectId:"sangdang-ent",storageBucket:"sangdang-ent.firebasestorage.app",messagingSenderId:"374113124138",appId:"1:374113124138:web:5c14892cf8ddc372316853"};
const $=s=>document.querySelector(s),W=["일","월","화","수","목","금","토"],pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const el=(t,x)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;return e};
if(!FB){$("#login").textContent="이 파일 상단의 const FB=null; 자리에 Firebase 설정값을 붙여넣어 주세요."}
else if(!window.firebase){$("#login").textContent="Firebase를 불러오지 못했어요. 인터넷 연결을 확인하고 GitHub Pages 주소(https://…)로 열어 주세요."}
else{
firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.firestore();
$("#lg").onclick=async()=>{try{await auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value)}catch(e){const m={"auth/operation-not-allowed":"Firebase에서 이메일/비밀번호 로그인이 켜져 있지 않아요.","auth/invalid-credential":"이메일 또는 비밀번호가 맞지 않거나, 등록되지 않은 계정이에요.","auth/invalid-email":"이메일 형식이 올바르지 않아요.","auth/user-not-found":"등록되지 않은 이메일이에요.","auth/wrong-password":"비밀번호가 맞지 않아요.","auth/too-many-requests":"시도가 너무 많아요. 잠시 후 다시 해 주세요.","auth/network-request-failed":"인터넷 연결을 확인해 주세요.","auth/operation-not-supported-in-this-environment":"파일을 직접 열지 말고 GitHub Pages 주소로 접속해 주세요."};
 alert((m[e.code]||"로그인에 실패했어요.")+"\n(오류: "+(e.code||e.message)+")")}};
$("#pw").onkeydown=e=>{if(e.key=="Enter")$("#lg").click()};
$("#out").onclick=()=>auth.signOut();$("#rf").onclick=()=>{loadR();loadC()};
auth.onAuthStateChanged(u=>{$("#login").hidden=!!u;$("#panel").hidden=!u;if(u){loadR();loadC()}});
async function loadR(){const box=$("#list");box.textContent="불러오는 중…";
 try{const s=await db.collection("reservations").where("expireAt",">",new Date()).orderBy("expireAt").get();
  box.replaceChildren();if(s.empty){box.textContent="예정된 예약이 없어요.";return}
  let last="";s.forEach(x=>{const r=x.data();
   if(r.date!=last){last=r.date;const d=new Date(r.date+"T00:00");box.appendChild(el("h3",`${d.getMonth()+1}월 ${d.getDate()}일 (${W[d.getDay()]})`))}
   const row=el("div");row.className="row";const a=el("a",r.phone);a.href="tel:"+String(r.phone).replace(/\D/g,"");
   const b=el("button","취소");b.className="s";b.onclick=()=>cancel(x.id,r);
   row.append(el("b",r.time),el("span",r.name),a,b);box.appendChild(row)})}
 catch(e){console.error(e);box.textContent="불러오지 못했어요. 관리자 계정과 Firestore 규칙을 확인해 주세요. (오류: "+(e.code||e.message)+")"}}
async function cancel(id,r){if(!confirm(`${r.date} ${r.time} ${r.name}님 예약을 취소할까요?`))return;
 try{const b=db.batch();b.delete(db.collection("reservations").doc(id));b.delete(db.collection("slots").doc(r.date+"_"+r.time));await b.commit()}catch(e){alert("취소하지 못했어요.")}loadR()}
async function loadC(){const box=$("#cl");box.replaceChildren();
 try{const s=await db.collection("closures").get();
  s.docs.filter(x=>x.id>=today()).sort((a,b)=>a.id<b.id?-1:1).forEach(x=>{
   const row=el("div");row.className="row";const b=el("button","삭제");b.className="s";
   b.onclick=async()=>{await db.collection("closures").doc(x.id).delete();loadC()};
   row.append(el("b",x.id),el("span",x.data().memo||""),b);box.appendChild(row)})}catch(e){}}
$("#ca").onclick=async()=>{const d=$("#cd").value;if(!d)return alert("날짜를 선택해 주세요.");
 try{await db.collection("closures").doc(d).set({memo:$("#cm").value.trim()});$("#cm").value="";
  const n=(await db.collection("reservations").where("date","==",d).get()).size;
  if(n)alert(`이 날짜에 이미 예약이 ${n}건 있어요. 예약 목록에서 확인해 연락해 주세요.`)}
 catch(e){alert("저장하지 못했어요.")}loadC();loadR()};
}
let ip;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("#ib").hidden=false});
$("#ib").onclick=async()=>{ip.prompt();await ip.userChoice;$("#ib").hidden=true};
if(matchMedia("(display-mode:standalone)").matches)$("#inst").hidden=true;
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></main></body></html>
